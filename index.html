<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klip</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      background: #151515;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #35d07f;
      cursor: pointer;
    }

    .search {
      flex: 1;
      max-width: 550px;
      margin: auto;
    }

    .search input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .green {
      background: #35d07f;
      color: #07140d;
    }

    .dark {
      background: #252525;
      color: white;
    }

    .profileButton {
      background: none;
      padding: 0;
    }

    .profileButton img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 25px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .welcome {
      padding: 35px 0;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .results {
      margin-top: 20px;
    }

    .result {
      background: #181818;
      border: 1px solid #292929;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .result img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    .resultName {
      font-size: 18px;
      font-weight: bold;
    }

    .username {
      color: #999;
      margin-top: 3px;
    }

    .profile {
      text-align: center;
      padding-top: 30px;
    }

    .bigPfp {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #35d07f;
    }

    .profile h1 {
      margin-bottom: 5px;
    }

    .profileStats {
      color: #aaa;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 25px 0;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 40px;
    }

    .modalBackground {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modalBackground.show {
      display: flex;
    }

    .modal {
      width: 90%;
      max-width: 430px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 25px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      background: #252525;
      border: 1px solid #444;
      color: white;
      border-radius: 8px;
    }

    .modalButtons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      border: 1px solid #444;
      padding: 12px 18px;
      border-radius: 10px;
      display: none;
      z-index: 200;
    }

    .status.show {
      display: block;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

    @media(max-width:700px) {
      header {
        padding: 0 12px;
        gap: 8px;
      }

      .logo {
        font-size: 23px;
      }

      main {
        padding: 15px;
      }

      .welcome h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo" onclick="showHome()">Klip</div>

  <div class="search">
    <input
      id="searchInput"
      type="text"
      placeholder="Search people..."
      oninput="searchPeople()"
    >
  </div>

  <button id="loginButton" class="green" onclick="login()">Sign in</button>

  <button
    id="myProfileButton"
    class="profileButton"
    style="display:none"
    onclick="openMyProfile()"
  >
    <img id="headerPfp" src="">
  </button>
</header>


<main>

  <!-- HOME -->
  <section id="homePage" class="page active">

    <div class="welcome">
      <h1>Welcome to Klip 👋</h1>
      <p>Search for people, discover creators, and build your profile.</p>
    </div>

    <div id="searchResults" class="results"></div>

    <div id="homeMessage" class="empty">
      Search a username above to find people.
    </div>

  </section>


  <!-- PROFILE -->
  <section id="profilePage" class="page">

    <div class="profile">

      <img id="profilePfp" class="bigPfp" src="">

      <h1 id="profileName">Loading...</h1>

      <div id="profileUsername" class="username"></div>

      <div id="profileStats" class="profileStats">
        0 followers
      </div>

      <button id="followButton" class="green" onclick="toggleFollow()">
        Follow
      </button>

      <div style="margin-top:15px">
        <button class="dark" onclick="showHome()">← Back</button>
      </div>

      <div class="tabs">
        <button class="dark">Klip's</button>
      </div>

      <div id="profileVideos" class="empty">
        No Klips yet.
      </div>

    </div>

  </section>


  <!-- MY PROFILE -->
  <section id="myProfilePage" class="page">

    <div class="profile">

      <img id="myProfilePfp" class="bigPfp" src="">

      <h1 id="myProfileName">Your Profile</h1>

      <div id="myProfileUsername" class="username"></div>

      <br>

      <button class="green" onclick="editProfile()">
        Edit Profile
      </button>

      <button class="dark" onclick="logout()">
        Sign out
      </button>

      <div class="tabs">
        <button class="dark">My Klips</button>
      </div>

      <div class="empty">
        Your Klips will appear here.
      </div>

    </div>

  </section>

</main>


<!-- EDIT PROFILE MODAL -->

<div id="editModal" class="modalBackground">

  <div class="modal">

    <h2>Edit Profile</h2>

    <label>Display name</label>
    <input id="editName" placeholder="Your name">

    <label>Username</label>
    <input id="editUsername" placeholder="username">

    <label>Profile picture URL</label>
    <input id="editPfp" placeholder="https://...">

    <div class="modalButtons">
      <button class="dark" onclick="closeEdit()">Cancel</button>
      <button class="green" onclick="saveProfile()">Save</button>
    </div>

  </div>

</div>


<div id="status" class="status"></div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    getDocs,
    query,
    where,
    arrayUnion,
    arrayRemove
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // YOUR FIREBASE CONFIG

  const firebaseConfig = {
    apiKey: "AIzaSyAU654sP10sPaH0SlrpBFHvmJl-Y2NR7ZE",
    authDomain: "klip-48f94.firebaseapp.com",
    projectId: "klip-48f94",
    storageBucket: "klip-48f94.firebasestorage.app",
    messagingSenderId: "440103236219",
    appId: "1:440103236219:web:a3cc919035975047d7a8de",
    measurementId: "G-173KRF89VN"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const provider = new GoogleAuthProvider();


  let currentUser = null;
  let viewedUser = null;


  const defaultPfp =
    "https://ui-avatars.com/api/?background=35d07f&color=07140d&name=K";


  // STATUS MESSAGE

  function status(message) {

    const box = document.getElementById("status");

    box.textContent = message;
    box.classList.add("show");

    setTimeout(() => {
      box.classList.remove("show");
    }, 2500);
  }


  // LOGIN

  window.login = async function() {

    try {

      await signInWithPopup(auth, provider);

      status("Signed in!");

    } catch(error) {

      console.error(error);

      status("Sign-in failed: " + error.message);

    }

  };


  // LOGOUT

  window.logout = async function() {

    await signOut(auth);

    showHome();

    status("Signed out.");

  };


  // AUTH STATE

  onAuthStateChanged(auth, async (user) => {

    currentUser = user;

    const loginButton =
      document.getElementById("loginButton");

    const myProfileButton =
      document.getElementById("myProfileButton");

    if(user) {

      loginButton.style.display = "none";

      myProfileButton.style.display = "block";

      document.getElementById("headerPfp").src =
        user.photoURL || defaultPfp;

      await createUserIfNeeded(user);

    } else {

      loginButton.style.display = "block";

      myProfileButton.style.display = "none";

    }

  });


  // CREATE USER PROFILE

  async function createUserIfNeeded(user) {

    const userRef = doc(db, "users", user.uid);

    const snap = await getDoc(userRef);

    if(!snap.exists()) {

      const username =
        makeUsername(user.displayName || "user");

      await setDoc(userRef, {

        uid: user.uid,

        name: user.displayName || "Klip User",

        username: username,

        usernameLower: username.toLowerCase(),

        photoURL: user.photoURL || defaultPfp,

        followers: [],

        following: [],

        createdAt: Date.now()

      });

    }

  }


  // CREATE AVAILABLE USERNAME

  function makeUsername(name) {

    let username =
      name
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "")
        .slice(0, 15);

    if(!username) username = "user";

    username += Math.floor(Math.random() * 9999);

    return username;

  }


  // SEARCH PEOPLE

  window.searchPeople = async function() {

    const input =
      document.getElementById("searchInput");

    const text =
      input.value.trim().toLowerCase();

    const results =
      document.getElementById("searchResults");

    const message =
      document.getElementById("homeMessage");


    results.innerHTML = "";


    if(!text) {

      message.style.display = "block";

      return;

    }


    message.style.display = "none";

    results.innerHTML =
      `<div class="loading">Searching...</div>`;


    try {

      const usersRef =
        collection(db, "users");

      const q =
        query(
          usersRef,
          where("usernameLower", ">=", text),
          where("usernameLower", "<=", text + "\uf8ff")
        );


      const snapshot =
        await getDocs(q);


      results.innerHTML = "";


      if(snapshot.empty) {

        results.innerHTML =
          `<div class="empty">No people found.</div>`;

        return;

      }


      snapshot.forEach(docSnap => {

        const user = docSnap.data();

        const div =
          document.createElement("div");

        div.className = "result";


        div.innerHTML = `

          <img src="${escapeHtml(user.photoURL || defaultPfp)}">

          <div>

            <div class="resultName">
              ${escapeHtml(user.name || "Klip User")}
            </div>

            <div class="username">
              @${escapeHtml(user.username || "")}
            </div>

          </div>

        `;


        div.onclick = () =>
          openProfile(user.uid);


        results.appendChild(div);

      });


    } catch(error) {

      console.error(error);

      results.innerHTML =
        `<div class="empty">
          Search error. Check your Firestore rules.
        </div>`;

    }

  };


  // OPEN PROFILE

  window.openProfile = async function(uid) {

    const userSnap =
      await getDoc(doc(db, "users", uid));

    if(!userSnap.exists()) {

      status("User not found.");

      return;

    }


    viewedUser = {

      uid: uid,

      ...userSnap.data()

    };


    document.getElementById("homePage")
      .classList.remove("active");

    document.getElementById("myProfilePage")
      .classList.remove("active");

    document.getElementById("profilePage")
      .classList.add("active");


    document.getElementById("profilePfp").src =
      viewedUser.photoURL || defaultPfp;

    document.getElementById("profileName").textContent =
      viewedUser.name || "Klip User";

    document.getElementById("profileUsername").textContent =
      "@" + (viewedUser.username || "");

    document.getElementById("profileStats").textContent =
      (viewedUser.followers?.length || 0) + " followers";


    const followButton =
      document.getElementById("followButton");


    if(currentUser && currentUser.uid === uid) {

      followButton.style.display = "none";

    } else {

      followButton.style.display = "inline-block";

      const following =
        viewedUser.followers?.includes(currentUser?.uid);

      followButton.textContent =
        following ? "Following" : "Follow";

    }

  };


  // FOLLOW / UNFOLLOW

  window.toggleFollow = async function() {

    if(!currentUser) {

      status("Sign in first.");

      return;

    }


    if(!viewedUser) return;

    if(currentUser.uid === viewedUser.uid) return;


    const myRef =
      doc(db, "users", currentUser.uid);

    const theirRef =
      doc(db, "users", viewedUser.uid);


    const following =
      viewedUser.followers?.includes(currentUser.uid);


    try {

      if(following) {

        await updateDoc(theirRef, {

          followers:
            arrayRemove(currentUser.uid)

        });

        await updateDoc(myRef, {

          following:
            arrayRemove(viewedUser.uid)

        });

        status("Unfollowed.");

      } else {

        await updateDoc(theirRef, {

          followers:
            arrayUnion(currentUser.uid)

        });

        await updateDoc(myRef, {

          following:
            arrayUnion(viewedUser.uid)

        });

        status("Following!");

      }


      await openProfile(viewedUser.uid);

    } catch(error) {

      console.error(error);

      status("Could not update follow.");

    }

  };


  // MY PROFILE

  window.openMyProfile = async function() {

    if(!currentUser) return;


    const snap =
      await getDoc(
        doc(db, "users", currentUser.uid)
      );


    if(!snap.exists()) return;


    const user =
      snap.data();


    document.getElementById("homePage")
      .classList.remove("active");

    document.getElementById("profilePage")
      .classList.remove("active");

    document.getElementById("myProfilePage")
      .classList.add("active");


    document.getElementById("myProfilePfp").src =
      user.photoURL || defaultPfp;

    document.getElementById("myProfileName").textContent =
      user.name || "Klip User";

    document.getElementById("myProfileUsername").textContent =
      "@" + (user.username || "");

  };


  // EDIT PROFILE

  window.editProfile = async function() {

    if(!currentUser) return;


    const snap =
      await getDoc(
        doc(db, "users", currentUser.uid)
      );


    if(!snap.exists()) return;


    const user =
      snap.data();


    document.getElementById("editName").value =
      user.name || "";

    document.getElementById("editUsername").value =
      user.username || "";

    document.getElementById("editPfp").value =
      user.photoURL || "";


    document
      .getElementById("editModal")
      .classList.add("show");

  };


  window.closeEdit = function() {

    document
      .getElementById("editModal")
      .classList.remove("show");

  };


  // SAVE PROFILE

  window.saveProfile = async function() {

    if(!currentUser) return;


    const name =
      document.getElementById("editName")
        .value.trim();


    const username =
      document.getElementById("editUsername")
        .value.trim()
        .replace(/^@/, "")
        .toLowerCase();


    const photoURL =
      document.getElementById("editPfp")
        .value.trim();


    if(!name || !username) {

      status("Name and username are required.");

      return;

    }


    if(!/^[a-z0-9_]+$/.test(username)) {

      status("Username can only use letters, numbers and _.");

      return;

    }


    try {

      // Check whether another user already has this username

      const q =
        query(
          collection(db, "users"),
          where("usernameLower", "==", username)
        );


      const results =
        await getDocs(q);


      let usernameTaken = false;


      results.forEach(result => {

        if(result.id !== currentUser.uid) {

          usernameTaken = true;

        }

      });


      if(usernameTaken) {

        status("That username is already taken.");

        return;

      }


      await updateDoc(
        doc(db, "users", currentUser.uid),
        {

          name: name,

          username: username,

          usernameLower: username,

          photoURL: photoURL || defaultPfp

        }
      );


      document.getElementById("headerPfp").src =
        photoURL || defaultPfp;


      closeEdit();

      await openMyProfile();

      status("Profile updated!");

    } catch(error) {

      console.error(error);

      status("Couldn't save profile.");

    }

  };


  // HOME

  window.showHome = function() {

    document.getElementById("profilePage")
      .classList.remove("active");

    document.getElementById("myProfilePage")
      .classList.remove("active");

    document.getElementById("homePage")
      .classList.add("active");

  };


  // BASIC HTML ESCAPE

  function escapeHtml(value) {

    return String(value)

      .replaceAll("&", "&amp;")

      .replaceAll("<", "&lt;")

      .replaceAll(">", "&gt;")

      .replaceAll('"', "&quot;")

      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
